[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
memchr = "2"
memmap2 = "0.9"
parquet = { version = "57", default-features = false }
rayon = "1"
rustc-hash = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
